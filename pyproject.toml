[project]
name = "nob-api"
version = "2.1.0"
description = "Nobitex Portfolio & Trade History Analytics Web Dashboard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=44.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "jdatetime>=6.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nob"]

[project.scripts]
nob-web = "nob.server:main"
